name: schedule-probe

# 临时诊断用：每 5 分钟跑一次，用来确认本仓库的 schedule 触发器到底有没有生效。
# 确认完就可以删掉这个文件。
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: 打一行日志
        run: |
          echo "触发事件: ${{ github.event_name }}"
          echo "UTC 时间: $(date -u '+%Y-%m-%dT%H:%M:%SZ')"
          echo "北京时间: $(TZ=Asia/Shanghai date '+%Y-%m-%d %H:%M')"
