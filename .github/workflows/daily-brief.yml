name: daily-brief

on:
  # 双保险：GitHub 自带定时（可能迟到数小时）+ 外部定时器 cron-job.org 精确调 workflow_dispatch。
  # 谁先跑谁发信，后到的会被「今天是否已经发过」这一步跳过，所以不会一天两封。详见 README「定时触发」。
  schedule:
    - cron: "7 23 * * *"   # 前一天 23:07 UTC = 次日 07:07 北京时间
  workflow_dispatch:
    inputs:
      city:
        description: "临时覆盖城市（留空则用 Secrets 里的 CITY）"
        required: false
        default: ""
      dry_run:
        description: "只生成不推送"
        type: boolean
        default: false
      force:
        description: "今天已经发过也再发一次"
        type: boolean
        default: false

permissions:
  contents: read
  actions: read   # 读运行记录，判断今天是否已经发过

concurrency:
  group: daily-brief
  cancel-in-progress: false

jobs:
  brief:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 今天是否已经发过
        id: guard
        if: inputs.force != true && inputs.dry_run != true
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          CURRENT_ID: ${{ github.run_id }}
        run: |
          export TODAY=$(TZ=Asia/Shanghai date +%F)
          echo "北京时间今天：$TODAY"
          COUNT=$(curl -sS \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$REPO/actions/workflows/daily-brief.yml/runs?per_page=30" \
            | python3 -c '
          import json, os, sys
          from datetime import datetime, timedelta, timezone

          bj = timezone(timedelta(hours=8))
          today = os.environ["TODAY"]
          cur = os.environ["CURRENT_ID"]
          n = 0
          for run in json.load(sys.stdin).get("workflow_runs", []):
              if str(run.get("id")) == cur:
                  continue
              if run.get("conclusion") != "success":
                  continue
              if not run.get("created_at"):
                  continue
              stamp = datetime.strptime(run["created_at"], "%Y-%m-%dT%H:%M:%SZ")
              day = stamp.replace(tzinfo=timezone.utc).astimezone(bj).strftime("%F")
              if day == today:
                  n += 1
          print(n)
          ')
          case "$COUNT" in
            ''|*[!0-9]*) COUNT=0 ;;
          esac
          echo "今天已成功运行：$COUNT 次"
          if [ "$COUNT" -gt 0 ]; then
            echo "今天已经发过了，跳过。想重发请勾 force。"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      # 纯标准库，无依赖安装这一步
      - name: 生成并推送简报
        if: steps.guard.outputs.skip != 'true'
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          DEEPSEEK_MODEL: ${{ vars.DEEPSEEK_MODEL }}
          CITY: ${{ inputs.city || secrets.CITY }}
          PUSH_CHANNEL: ${{ secrets.PUSH_CHANNEL }}
          PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
          FEISHU_WEBHOOK: ${{ secrets.FEISHU_WEBHOOK }}
          FEISHU_SECRET: ${{ secrets.FEISHU_SECRET }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
          NEWS_LIMIT: "44"
          LOOKBACK_HOURS: "30"
          WINDOW_START: "07:00"   # 取稿窗口：昨天 07:00 → 现在
        run: |
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            python3 scripts/daily_brief.py --dry-run
          else
            python3 scripts/daily_brief.py
          fi

      - name: 失败时留下日志
        if: failure()
        run: echo "任务失败，请在上方日志里找 [HH:MM:SS] 开头的行"
