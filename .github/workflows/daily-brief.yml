name: daily-brief

on:
  # 定时触发交给外部定时器（cron-job.org 等）调用 workflow_dispatch，原因见 README「定时不触发怎么办」。
  # 本仓库的 GitHub 自带 schedule 已实测失效：多个 cron 表达式、两天时间、0 次触发，加 5 分钟探针也不触发。
  # 如果哪天想换回 GitHub 自带定时，把下面四行取消注释并删掉外部定时器，避免一天发两封：
  # schedule:
  #   - cron: "7 23 * * *"   # 前一天 23:07 UTC = 次日 07:07 北京时间
  workflow_dispatch:
    inputs:
      city:
        description: "临时覆盖城市（留空则用 Secrets 里的 CITY）"
        required: false
        default: ""
      dry_run:
        description: "只生成不推送"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: daily-brief
  cancel-in-progress: false

jobs:
  brief:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # 纯标准库，无依赖安装这一步
      - name: 生成并推送简报
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          DEEPSEEK_MODEL: ${{ vars.DEEPSEEK_MODEL }}
          CITY: ${{ inputs.city || secrets.CITY }}
          PUSH_CHANNEL: ${{ secrets.PUSH_CHANNEL }}
          PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
          FEISHU_WEBHOOK: ${{ secrets.FEISHU_WEBHOOK }}
          FEISHU_SECRET: ${{ secrets.FEISHU_SECRET }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
          NEWS_LIMIT: "44"
          LOOKBACK_HOURS: "30"
          WINDOW_START: "07:00"   # 取稿窗口：昨天 07:00 → 现在
        run: |
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            python3 scripts/daily_brief.py --dry-run
          else
            python3 scripts/daily_brief.py
          fi

      - name: 失败时留下日志
        if: failure()
        run: echo "任务失败，请在上方日志里找 [HH:MM:SS] 开头的行"
