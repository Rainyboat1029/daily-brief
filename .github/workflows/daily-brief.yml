name: daily-brief

on:
  schedule:
    # GitHub 的 cron 用 UTC。00:07 UTC = 当天 08:07 北京时间。
    # 故意避开整点：00:00 UTC 是全网 schedule 最拥堵的时刻，经常排队十几到几十分钟。
    - cron: "7 0 * * *"
  workflow_dispatch:
    inputs:
      city:
        description: "临时覆盖城市（留空则用 Secrets 里的 CITY）"
        required: false
        default: ""
      dry_run:
        description: "只生成不推送"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: daily-brief
  cancel-in-progress: false

jobs:
  brief:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # 纯标准库，无依赖安装这一步
      - name: 生成并推送简报
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          DEEPSEEK_MODEL: ${{ vars.DEEPSEEK_MODEL }}
          CITY: ${{ inputs.city || secrets.CITY }}
          PUSH_CHANNEL: ${{ secrets.PUSH_CHANNEL }}
          PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
          FEISHU_WEBHOOK: ${{ secrets.FEISHU_WEBHOOK }}
          FEISHU_SECRET: ${{ secrets.FEISHU_SECRET }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
          NEWS_LIMIT: "44"
          LOOKBACK_HOURS: "30"
        run: |
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            python3 scripts/daily_brief.py --dry-run
          else
            python3 scripts/daily_brief.py
          fi

      - name: 失败时留下日志
        if: failure()
        run: echo "任务失败，请在上方日志里找 [HH:MM:SS] 开头的行"
